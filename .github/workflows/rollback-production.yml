# Instant rollback of the public site to an earlier version. No rebuild needed.
# Runbook: docs/deploy/README.md
name: Roll back production

on:
  workflow_dispatch:
    inputs:
      version_id:
        description: "Version ID to restore (leave empty for the previous version)"
        required: false
      reason:
        description: "Why are we rolling back?"
        required: true

concurrency:
  group: production
  cancel-in-progress: false

permissions:
  contents: read

env:
  WRANGLER_VERSION: 4.149.0
  WRANGLER_SEND_METRICS: "false"

jobs:
  rollback:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: production
      url: ${{ vars.PRODUCTION_URL }}
    steps:
      - uses: actions/checkout@v5

      - name: Show recent versions
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes "wrangler@${WRANGLER_VERSION}" deployments list | tail -60

      - name: Roll back
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          VERSION_ID: ${{ inputs.version_id }}
          REASON: ${{ inputs.reason }}
        run: |
          npx --yes "wrangler@${WRANGLER_VERSION}" rollback ${VERSION_ID:+"$VERSION_ID"} \
            --message "Rollback by ${GITHUB_ACTOR}: ${REASON}" --yes

      - name: Smoke test
        if: vars.PRODUCTION_URL != ''
        run: scripts/smoke.sh "${{ vars.PRODUCTION_URL }}" production
