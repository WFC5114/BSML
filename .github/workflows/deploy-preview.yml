# One private preview link per pull request, plus a stable staging link for main.
# Runbook: docs/deploy/README.md
name: Deploy preview

on:
  pull_request:
    types: [opened, synchronize, reopened]
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: preview-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write

env:
  WRANGLER_VERSION: 4.149.0
  WRANGLER_SEND_METRICS: "false"

jobs:
  preview:
    # Secrets are not available to pull requests from forks.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check Cloudflare credentials
        id: creds
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [[ -z "$CLOUDFLARE_API_TOKEN" || -z "$CLOUDFLARE_ACCOUNT_ID" ]]; then
            echo "::warning::Cloudflare is not connected yet (secrets CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID). Skipping the preview. See docs/deploy/README.md."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v5
        if: steps.creds.outputs.ready == 'true'

      - uses: actions/setup-node@v5
        if: steps.creds.outputs.ready == 'true'
        with:
          node-version-file: ${{ hashFiles('.nvmrc') != '' && '.nvmrc' || '' }}
          node-version: ${{ hashFiles('.nvmrc') == '' && '22' || '' }}

      - name: Build site
        if: steps.creds.outputs.ready == 'true'
        run: scripts/ci-build.sh

      - name: Upload preview (pull request)
        id: pr
        if: steps.creds.outputs.ready == 'true' && github.event_name == 'pull_request'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          PR: ${{ github.event.pull_request.number }}
          SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -o pipefail
          npx --yes "wrangler@${WRANGLER_VERSION}" versions upload --env preview \
            --preview-alias "pr-${PR}" --tag "pr-${PR}" --message "PR #${PR} @ ${SHA::7}" 2>&1 | tee upload.log
          url=$(grep -oE 'https://pr-[^ ]+\.workers\.dev' upload.log | head -1)
          [[ -n "$url" ]] || url=$(grep -oE 'https://[^ ]+\.workers\.dev' upload.log | head -1)
          [[ -n "$url" ]] || { echo "::error::No preview URL in Wrangler output"; exit 1; }
          echo "url=$url" >> "$GITHUB_OUTPUT"

      - name: Deploy staging (main)
        id: staging
        if: steps.creds.outputs.ready == 'true' && github.event_name != 'pull_request'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -o pipefail
          npx --yes "wrangler@${WRANGLER_VERSION}" deploy --env preview \
            --message "main @ ${GITHUB_SHA::7}" 2>&1 | tee deploy.log
          url="${{ vars.STAGING_URL }}"
          [[ -n "$url" ]] || url=$(grep -oE 'https://[^ ]+\.workers\.dev' deploy.log | head -1)
          echo "url=$url" >> "$GITHUB_OUTPUT"

      - name: Smoke test
        if: steps.creds.outputs.ready == 'true'
        env:
          PREVIEW_PASSWORD: ${{ secrets.PREVIEW_PASSWORD }}
        run: scripts/smoke.sh "${{ steps.pr.outputs.url || steps.staging.outputs.url }}" preview

      - name: Comment preview link on the pull request
        if: steps.pr.outputs.url && always()
        uses: actions/github-script@v7
        env:
          URL: ${{ steps.pr.outputs.url }}
          OK: ${{ job.status }}
        with:
          script: |
            const marker = '<!-- bsml-preview -->';
            const sha = context.payload.pull_request.head.sha.slice(0, 7);
            const ok = process.env.OK === 'success';
            const body = `${marker}\n**Preview** ${ok ? 'is ready' : 'deployed, but the smoke test failed'}: ${process.env.URL}\n\n` +
              `Commit \`${sha}\`. Not indexed by search engines. ` +
              `Mainland China visitors should use the staging link on BSML's own domain instead of workers.dev.`;
            const { owner, repo } = context.repo;
            const issue_number = context.payload.pull_request.number;
            const comments = await github.paginate(github.rest.issues.listComments, { owner, repo, issue_number });
            const mine = comments.find(c => c.body?.includes(marker));
            if (mine) await github.rest.issues.updateComment({ owner, repo, comment_id: mine.id, body });
            else await github.rest.issues.createComment({ owner, repo, issue_number, body });
